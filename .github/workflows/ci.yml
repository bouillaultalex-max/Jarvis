name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          # Binaire officiel gitleaks (github.com/gitleaks/gitleaks), version figée
          # pour la reproductibilité. Le wrapper Action officiel (gitleaks/gitleaks-action)
          # exige une licence gratuite pour tout compte GitHub de type organisation ;
          # le binaire CLI, lui, reste MIT/gratuit sans condition — évite ce risque.
          GITLEAKS_VERSION="8.21.2"
          GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Gitleaks secret scan
        run: /tmp/gitleaks detect --source=. --no-git --no-banner --redact --exit-code 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install (reproductible)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        # Coverage informatif uniquement (aucun seuil bloquant, OUT-05) — le
        # surcoût mesuré (~0.6s sur 505 tests) ne justifie pas un job séparé.
        run: npm run test:coverage

      - name: Scan for obvious committed secrets
        run: |
          # Scan basique par motifs connus (clés privées, tokens de fournisseurs
          # courants). Ce n'est PAS un scanner de secrets exhaustif (type
          # gitleaks/trufflehog) — seulement un filet de sécurité low-cost sans
          # dépendance externe.
          PATTERN="BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY"
          PATTERN="$PATTERN|AKIA[0-9A-Z]{16}"
          PATTERN="$PATTERN|gh[pousr]_[A-Za-z0-9]{36}"
          PATTERN="$PATTERN|sk-[A-Za-z0-9]{20,}"
          PATTERN="$PATTERN|xox[baprs]-[A-Za-z0-9-]{10,}"
          if git grep -nIE "$PATTERN" -- . ':!*.lock' ':!package-lock.json'; then
            echo "Potential secret material found in tracked files." >&2
            exit 1
          fi
          echo "No obvious secret patterns found."
